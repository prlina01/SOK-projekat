[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sok-graph-platform"
version = "1.0.0"
description = "Reusable graph platform services and UI integration"
requires-python = ">=3.10"
dependencies = [
    "sok-graph-api"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["service*"]
